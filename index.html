<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Прототип Подхвата</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Макет: слева пульт прототипа, справа телефон с мини-приложением в Telegram; на телефоне — приложение во весь экран, пульт сжат в полоску */
:root {
  --desk: #ECE7DE;
  --bg: #FBF8F2;
  --surface: #FFFFFF;
  --surface-2: #F3EEE5;
  --ink: #2B282D;
  --ink-2: #6F6973;
  --line: #E6DFD3;
  --accent: #FF6C04;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE9D9;
  --good: #1E9B57;
  --good-soft: #DDF3E6;
  --bad: #D14343;
  --water: #CFE2EC;
  --shadow: 0 1px 2px rgba(43,40,45,.06), 0 8px 24px rgba(43,40,45,.08);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #0E0D10; --bg: #17161A; --surface: #222025; --surface-2: #2B292F; --ink: #F3F0EB; --ink-2: #A59FA8;
  --line: #36333A; --accent: #FF7A1F; --accent-ink: #FFFFFF; --accent-soft: #3B2415; --good: #3BC07A; --good-soft: #17301F;
  --bad: #F06B6B; --water: #1E323C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --desk: #0E0D10; --bg: #17161A; --surface: #222025; --surface-2: #2B292F; --ink: #F3F0EB; --ink-2: #A59FA8;
  --line: #36333A; --accent: #FF7A1F; --accent-ink: #FFFFFF; --accent-soft: #3B2415; --good: #3BC07A; --good-soft: #17301F;
  --bad: #F06B6B; --water: #1E323C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Пульт и телефон */
.stage { min-height: 100%; display: flex; gap: 48px; align-items: center; justify-content: center; padding-inline: 24px; padding-block: 32px; box-sizing: border-box; }
.panel { width: 300px; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.panel p { margin: 0; color: var(--ink-2); }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 8px 10px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; }
.tries { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
.pbtn { padding: 10px 14px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; text-align: left; }
.pbtn small { display: block; font-weight: 400; color: var(--ink-2); font-size: 13px; }

.phone { width: 390px; height: min(820px, calc(100vh - 48px)); min-height: 640px; flex: none; border-radius: 48px; background: var(--bg); box-shadow: 0 0 0 10px #1C1B1F, 0 30px 80px rgba(0,0,0,.25); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.tg { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; padding-top: 14px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 15px; }
.tg .close { color: var(--ink-2); }
.tg .ttl { text-align: center; line-height: 1.15; font-weight: 600; }
.tg .ttl small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.tg .more { width: 28px; text-align: right; color: var(--ink-2); font-size: 20px; letter-spacing: 1px; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.pad { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.tabs { flex: none; display: flex; justify-content: space-around; align-items: center; padding: 6px 8px 18px; background: var(--surface); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--ink-2); padding: 4px 8px; min-width: 60px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab.plus span.p { width: 48px; height: 48px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 28px; line-height: 1; margin-top: -14px; box-shadow: 0 6px 16px rgba(255,108,4,.35); }

/* Общие элементы */
h1, h2, h3 { margin: 0; }
.h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; text-wrap: balance; }
.h2 { font-weight: 700; font-size: 17px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 500; color: var(--ink); border: 1px solid transparent; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.hot { background: var(--accent); color: var(--accent-ink); }
.box { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.btn { padding: 14px 18px; border-radius: 14px; font-weight: 700; font-size: 16px; text-align: center; }
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.ok { background: var(--good); color: #fff; }
.mainbar { position: sticky; bottom: 0; padding: 12px 16px 16px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.mainbar .btn { width: 100%; display: block; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 16px; }
.mascot { width: 88px; height: 88px; border-radius: 50%; background: var(--accent-soft) center/cover no-repeat; flex: none; }
.empty { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 24px; }

/* Стопка карточек */
.stack { position: relative; height: 470px; }
.card { position: absolute; inset: 0; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: transform .25s ease; }
.card.under { transform: translateY(12px) scale(.95); }
.card.under2 { transform: translateY(24px) scale(.9); }
.card.dragging { transition: none; cursor: grabbing; }
.card.hotcard { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.photo { height: 168px; flex: none; position: relative; display: flex; align-items: flex-end; padding: 14px; color: #fff; overflow: hidden; }
.photo .letter { position: absolute; right: -10px; top: -30px; font-family: var(--f-display); font-weight: 700; font-size: 170px; line-height: 1; opacity: .18; }
.photo .vn { font-weight: 700; font-size: 18px; position: relative; display: flex; gap: 8px; align-items: center; }
.photo .badge { position: absolute; left: 12px; top: 12px; }
.cbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.sum { font-family: var(--f-display); font-weight: 700; font-size: 38px; letter-spacing: -.02em; line-height: 1.05; }
.sum s { font-family: var(--f-body); font-weight: 500; font-size: 15px; color: var(--ink-2); margin-left: 6px; letter-spacing: 0; }
.stamp { position: absolute; top: 24px; padding: 6px 12px; border: 3px solid; border-radius: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; opacity: 0; transform: rotate(-12deg); z-index: 2; }
.stamp.yes { left: 18px; color: var(--good); border-color: var(--good); background: var(--surface); }
.stamp.no { right: 18px; color: var(--bad); border-color: var(--bad); background: var(--surface); transform: rotate(12deg); }
.actions { display: flex; gap: 12px; }
.actions .btn { flex: 1; }

/* Шкала статуса */
.steps { display: flex; gap: 4px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--accent); }
.steplabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); }
.steplabels b { color: var(--ink); font-weight: 600; }

/* Списки */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); text-align: left; width: 100%; }
.item .grow { flex: 1; min-width: 0; }
.item .title { font-weight: 600; }
.item .money { font-weight: 700; font-size: 16px; white-space: nowrap; }
.thumb { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 700; flex: none; }
.box.need { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat div { background: var(--surface); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--f-display); font-size: 18px; }
.stat span { font-size: 12px; color: var(--ink-2); }

/* Слои поверх */
.layer { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(20,18,22,.45); }
.sheet { background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 14px; max-height: 88%; overflow-y: auto; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.snack { position: absolute; left: 12px; right: 12px; bottom: 86px; z-index: 30; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.snack .grow { flex: 1; min-width: 0; font-size: 14px; }
.snack b { display: block; font-size: 15px; }
.snack button { color: var(--accent); font-weight: 700; padding: 8px; white-space: nowrap; }
.snack .mascot { width: 40px; height: 40px; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 31; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

/* Сканер */
.scan { position: absolute; inset: 0; z-index: 25; background: #0B0A0C; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; }
.scan .frame { width: 230px; height: 230px; position: relative; border-radius: 20px; background: repeating-linear-gradient(45deg, #151418 0 12px, #1A191D 12px 24px); overflow: hidden; }
.scan .frame::before, .scan .frame::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--accent); border-radius: 20px; clip-path: polygon(0 0, 30% 0, 30% 3%, 3% 3%, 3% 30%, 0 30%, 0 70%, 3% 70%, 3% 97%, 30% 97%, 30% 100%, 70% 100%, 70% 97%, 97% 97%, 97% 70%, 100% 70%, 100% 30%, 97% 30%, 97% 3%, 70% 3%, 70% 0, 100% 0, 100% 100%, 0 100%); }
.scan .line { position: absolute; left: 8%; right: 8%; height: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: scanline 1.6s ease-in-out infinite alternate; }
@keyframes scanline { from { top: 10%; } to { top: 88%; } }
.scan .ghost { color: #fff; background: rgba(255,255,255,.12); }

/* Чат бота */
.chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.bub { max-width: 82%; padding: 9px 12px; border-radius: 16px; font-size: 15px; background: var(--surface); box-shadow: var(--shadow); align-self: flex-start; border-bottom-left-radius: 4px; }
.bub.me { align-self: flex-end; background: var(--accent-soft); border-radius: 16px; border-bottom-right-radius: 4px; }
.inline { margin-top: 8px; display: block; width: 100%; padding: 10px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.kbd { padding: 8px; display: grid; gap: 6px; background: var(--surface); border-top: 1px solid var(--line); }
.kbd button { padding: 12px; border-radius: 10px; background: var(--surface-2); font-weight: 600; }

/* Карта */
.map { position: relative; height: 560px; background: var(--surface-2); overflow: hidden; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pin { position: absolute; transform: translate(-50%, -100%); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13px; padding: 5px 9px; border-radius: 10px; box-shadow: var(--shadow); white-space: nowrap; }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); z-index: -1; }
.pin.hot { background: var(--accent); color: var(--accent-ink); }
.me-dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #2F80ED; border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(47,128,237,.2); transform: translate(-50%, -50%); }

/* Форма */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > .label { text-transform: none; letter-spacing: 0; font-size: 13px; }
.stepper { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 16px; padding: 8px; box-shadow: var(--shadow); }
.stepper button { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); font-size: 22px; font-weight: 600; }
.stepper .v { text-align: center; }
.stepper .v b { display: block; font-family: var(--f-display); font-size: 24px; }
.hint { background: var(--accent-soft); color: var(--ink); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px; }
.hint button { color: var(--accent); font-weight: 700; white-space: nowrap; }
.photo-up { display: flex; gap: 14px; align-items: center; background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); text-align: left; width: 100%; }
.photo-up .ph { width: 64px; height: 64px; border-radius: 50%; border: 2px dashed var(--accent); display: grid; place-items: center; color: var(--accent); font-size: 26px; flex: none; }
.qr { width: 220px; height: 220px; align-self: center; background: #fff; padding: 12px; border-radius: 16px; }
.stars { display: flex; gap: 6px; justify-content: center; }
.stars button { font-size: 34px; color: var(--line); line-height: 1; }
.stars button.on { color: var(--accent); }

/* Неделя, баннеры, ожидание */
.week { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.week::-webkit-scrollbar { display: none; }
.day { flex: none; width: 88px; border-radius: 14px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; border: 2px solid transparent; color: var(--ink); }
.day b { font-size: 14px; }
.day .c { font-size: 12px; color: var(--ink-2); }
.day .p { font-weight: 700; font-size: 13px; }
.day[aria-pressed="true"] { border-color: var(--accent); }
.banner { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: 0 0 0 2px var(--bad), var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.banner.wait { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* Рейтинги и отзывы */
.review { background: var(--surface); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.reply { border-left: 3px solid var(--accent); padding-left: 8px; font-size: 13px; }

/* Подробная карточка смены */
.dphoto { height: 140px; border-radius: 18px; position: relative; display: flex; align-items: flex-end; padding: 12px 14px; color: #fff; overflow: hidden; flex: none; }
.dphoto .letter { position: absolute; right: -6px; top: -26px; font-family: var(--f-display); font-weight: 700; font-size: 150px; line-height: 1; opacity: .18; }
.dphoto .vn { position: relative; font-weight: 700; font-size: 18px; }
.sec { display: flex; flex-direction: column; gap: 6px; }

/* Пуши бота */
.chat .day { align-self: center; font-size: 12px; color: var(--ink-2); background: var(--surface); padding: 2px 10px; border-radius: 10px; }
.push { padding: 0; overflow: hidden; }
.push .pphoto { height: 84px; display: flex; align-items: flex-end; padding: 10px 12px; color: #fff; font-weight: 700; position: relative; overflow: hidden; }
.push .pphoto .letter { position: absolute; right: -4px; top: -18px; font-family: var(--f-display); font-size: 100px; opacity: .18; line-height: 1; }
.push .pb { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.push .psum { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin-top: 4px; }
.ibtns { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 82%; margin-top: -4px; }
.ibtns.three { grid-template-columns: repeat(3, 1fr); }
.ibtns.one { grid-template-columns: 1fr; }
.ibtns button { padding: 9px 6px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; font-size: 14px; color: var(--accent); }
.ibtns .wide { grid-column: 1 / -1; }
.done { font-size: 13px; color: var(--good); font-weight: 600; margin-top: -4px; padding-left: 4px; }
.menu-btn { margin: 8px; padding: 12px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.check { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); width: 100%; font-size: 14px; }
.check .bx { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: var(--accent-ink); font-size: 14px; }
.check .bx.on { background: var(--accent); border-color: var(--accent); }

.mstrip { display: none; }

@media (max-width: 760px) {
  .stage { padding: 0; gap: 0; flex-direction: column; align-items: stretch; height: 100%; min-height: 0; }
  .panel { display: none; }
  .mstrip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--desk); flex: none; }
  .mstrip .brand { font-size: 15px; gap: 6px; }
  .mstrip .brand svg { width: 22px; height: 22px; }
  .mstrip .seg { flex: 1; }
  .mstrip .seg button { padding: 6px 4px; font-size: 13px; }
  .mstrip .reg { font-size: 13px; font-weight: 600; padding: 6px 8px; border-radius: 9px; background: var(--surface); }
  .phone { width: 100%; height: auto; flex: 1; border-radius: 0; box-shadow: none; }
  .tg { padding-top: 0; height: 44px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="stage">
  <aside class="panel" aria-label="Пульт прототипа">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 14c0-4 3-7 7-7h6v6h-6v20H6z" fill="var(--accent)"/><path d="M22 7h5c4 0 7 3 7 7v19h-7V13h-5z" fill="var(--accent)"/></svg>Подхват</div>
    <p>Тестовая версия мини-приложения в Telegram, не боевое приложение. Одна ссылка, две роли; все заведения и люди — пример.</p>
    <div class="field"><span class="label">Кто смотрит</span>
      <div class="seg" role="group" aria-label="Роль"><button data-a="role" data-v="free">Фрилансер</button><button data-a="role" data-v="venue">Заведение</button></div>
    </div>

/* ---------- Слои: шторки, сканер ---------- */
function pseudoQR() {
  let s = 7, cells = "";
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#111"/>`;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const inF = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
    if (!inF && rnd() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;
  }
  return `<svg class="qr" viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="QR-код точки">${cells}${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}</svg>`;
}

let toastTimer;
function toast(t) {

/* ---------- Свайпы ---------- */
function mountStacks() {
  const st = document.getElementById("offerStack");
  if (st) dragify(st, () => takeOffer(), () => skipOffer(), card => { S.sheet = { type: "detail", id: +card.dataset.id }; renderLayer(); });
  const ap = document.getElementById("appStack");
  if (ap) dragify(ap, d => pickApplicant(d), d => nextApplicant(d));
}
function dragify(stack, onRight, onLeft, onTap) {
  const card = stack.querySelector(".card.top");
  if (!card) return;
  let x0 = 0, dx = 0, active = false;
  const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");
  card.addEventListener("pointerdown", e => { active = true; x0 = e.clientX; dx = 0; card.classList.add("dragging"); card.setPointerCapture(e.pointerId); });
  card.addEventListener("pointermove", e => {
    if (!active) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!active) return; active = false; card.classList.remove("dragging");
    if (dx > 90) fly(card, 1, onRight); else if (dx < -90) fly(card, -1, onLeft);
    else { card.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0; if (Math.abs(dx) < 6 && onTap) onTap(card); }
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}
function fly(card, dir, done) {
  card.style.transition = "transform .3s ease";
  card.style.transform = `translateX(${dir * 520}px) rotate(${dir * 24}deg)`;
  setTimeout(() => done(), 260);
}
function flyTop(stackId, dir, onRight, onLeft) {
  const card = document.querySelector(`#${stackId} .card.top`);
  if (!card) return;
  card.querySelector(dir > 0 ? ".stamp.yes" : ".stamp.no").style.opacity = 1;
  fly(card, dir, dir > 0 ? onRight : onLeft);
}

function takeOffer() { const o = visibleOffers()[0]; if (o) takeShift(o); }
function takeShift(o) {
  const from = S.offers.includes(o) ? "offers" : "today";
  if (S.pending) commitPending();
  S[from] = S[from].filter(x => x !== o);
  S.sheet = null;
  S.pending = { o, from, left: 5, apply: S.newbie };
  render(); renderSnack();
  S.pending.timer = setInterval(() => {
    if (!S.pending) return;
    S.pending.left -= 1;
    if (S.pending.left <= 0) { const ap = S.pending.apply; commitPending(); toast(ap ? "Ответ заведения придёт во вкладку «Мои»" : "Адрес, телефон и меню — во вкладке «Мои»"); } else renderSnack();
  }, 1000);
}
function commitPending() {
  const p = S.pending; if (!p) return;
  clearInterval(p.timer); S.pending = null;
  if (p.apply) S.waiting.unshift({ o: p.o, urgent: p.o.date === "Сегодня" }); else S.mine.unshift(mineFrom(p.o));
  renderSnack(); render();
}
function mineFrom(o) {
  const info = VENUE_INFO[o.venue] || {};

}
function renderSnack() {

}
function skipOffer() { const o = visibleOffers()[0]; S.offers = S.offers.filter(x => x !== o); render(); toast("Ок, пришлём похожие"); }
function pickApplicant() {
  const a = pointApps()[0]; if (!a) return;

  render(); toast(`${a.name} назначен(а). Телефон — в карточке смены`);

  noshowok: () => { applyNoShow(S.sheet.id); S.sheet = null; render(); toast("Ищем замену срочно. Сергей может оспорить"); },
  vrate: d => { S.sheet = { type: "vrate", id: +d.v, stars: 5, tags: ["пришёл вовремя"], again: true }; renderLayer(); },
  vstar: d => { S.sheet.stars = +d.v; renderLayer(); },
  vtag: d => { const t = S.sheet.tags; const i = t.indexOf(d.v); i < 0 ? t.push(d.v) : t.splice(i, 1); renderLayer(); },
  vagain: () => { S.sheet.again = !S.sheet.again; if (S.sheet.again) S.sheet.never = false; renderLayer(); },
  vnever: () => { S.sheet.never = !S.sheet.never; if (S.sheet.never) S.sheet.again = false; renderLayer(); },
  vrated: () => { const sh = S.sheet, v = S.vshifts.find(x => x.id === sh.id); v.status = `Закрыта · ваша оценка ${sh.stars}`; v.step = 4; delete v.attn; S.sheet = null; render(); toast(sh.never ? `${v.name} больше не увидит ваши смены` : "Спасибо! Оценка ушла в рейтинг"); },
  vonb: d => { S.onb.step = +d.v; if (d.r) S.onb.post = d.r; render(); screen.scrollTop = 0; },
  vf: d => { const v = S.onb.v; if (d.g === "roles") { const i = v.roles.indexOf(d.v); i < 0 ? v.roles.push(d.v) : v.roles.splice(i, 1); } else v[d.g] = d.v; const top = screen.scrollTop; render(); screen.scrollTop = top; },
  vaccept: () => { S.onb.v.accept = !S.onb.v.accept; const top = screen.scrollTop; render(); screen.scrollTop = top; },
  vdone: () => { if (!S.onb.v.accept) { toast("Без согласия с правилами дальше нельзя"); return; } S.onb.step = 7; render(); screen.scrollTop = 0; },
  vfirst: () => { S.onb = null; S.role = "venue"; S.vtab = "new"; render(); screen.scrollTop = 0; },
  vinvite: () => { S.onb = null; S.role = "venue"; S.vtab = "team"; render(); S.sheet = { type: "invite" }; renderLayer(); },
  onb: d => { S.onb.step = +d.v; render(); },
  ank: d => { const arr = S.onb.a[d.g]; const i = arr.indexOf(d.v); if (d.g === "exp") { S.onb.a.exp = [d.v]; } else { i < 0 ? arr.push(d.v) : arr.splice(i, 1); } const top = screen.scrollTop; render(); screen.scrollTop = top; },
  photo: () => { S.onb.a.photo = true; const top = screen.scrollTop; render(); screen.scrollTop = top; },
  onbdone: () => { if (!S.onb.a.photo) { toast("Без фото дальше никак — нажми на кружок сверху"); return; } S.onb = null; S.tab = "shifts"; S.feed = "mine"; render(); toast("Готово! Первые смены уже пришли"); },
  theme: d => { if (d.v === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", d.v); document.querySelectorAll('[data-a="theme"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === d.v))); },
  reset: () => { if (S.pending) clearInterval(S.pending.timer); S = freshState(); renderSnack(); render(); toast("Начали заново"); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  if (el.dataset.a === "closesheet" && e.target.closest(".sheet")) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el.dataset, el, e);
});
document.querySelectorAll('[data-a="theme"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === "auto")));
render();
